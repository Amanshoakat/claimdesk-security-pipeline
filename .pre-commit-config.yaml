# Developer-machine stage: seconds of feedback before a secret reaches the
# remote. A convenience, not a control: `git commit --no-verify` skips it.
# The CI job is the control. Install with: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        args: ["--severity-level", "high", "--confidence-level", "medium"]
        exclude: ^tests/
